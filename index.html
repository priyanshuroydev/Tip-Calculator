<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="box">
        <p>Do You Want To Calculate Tip?</p>
        <div class="yesNoButtons">
          <button id="yesBtn">Yes</button>
          <button id="noBtn">No</button>
        </div>
        <div class="calc">
          <div class="display"></divclass>
          <div class="numbers">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>equal</button>
            <button>clear</button>
            <button>.</button>



          </divclass>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
